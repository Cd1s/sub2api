name: Ours Release

# fork 私有工作流：只在 vX.Y.Z-ours tag 上跑，产出 linux/arm64 二进制附件。
# 不建 GitHub Release、不推任何镜像、不碰上游。
on:
  push:
    tags:
      - 'v*-ours'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    # 双保险：即使这个文件被同步到上游仓库也不会在那边跑。
    if: github.repository == 'Cd1s/sub2api'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@v6
        with:
          version: 9

      - uses: actions/setup-node@v6
        with:
          node-version: '20'
          cache: 'pnpm'
          cache-dependency-path: frontend/pnpm-lock.yaml

      - uses: actions/setup-go@v6
        with:
          go-version-file: backend/go.mod
          check-latest: false
          cache-dependency-path: backend/go.sum

      - name: Backend tests
        working-directory: backend
        run: go test ./...

      - name: Patch unit tests (挂钩点护栏)
        working-directory: backend
        run: |
          go test ./internal/service/ -count=1 -v \
            -run 'Tiering|TieredPriorities|CandidateBetter|LoadPlan|ScoreSnapshot|SchedulingPriorityFor'

      - name: Build frontend (vite outDir = backend/internal/web/dist)
        run: |
          pnpm --dir frontend install --frozen-lockfile
          pnpm --dir frontend run build
          test -f backend/internal/web/dist/index.html

      - name: Build linux/arm64 binary
        working-directory: backend
        env:
          CGO_ENABLED: '0'
          GOOS: linux
          GOARCH: arm64
        run: |
          VERSION="$(./scripts/resolve-version.sh)"
          COMMIT="$(git rev-parse --short HEAD)"
          DATE="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          go build -tags=embed -trimpath \
            -ldflags "-s -w -X main.Version=${VERSION} -X main.Commit=${COMMIT} -X main.Date=${DATE} -X main.BuildType=release" \
            -o ../dist/sub2api_linux_arm64 ./cmd/server

      - name: Checksum
        run: |
          cd dist
          sha256sum sub2api_linux_arm64 | tee sub2api_linux_arm64.sha256

      - uses: actions/upload-artifact@v7
        with:
          name: sub2api_linux_arm64
          path: |
            dist/sub2api_linux_arm64
            dist/sub2api_linux_arm64.sha256
          retention-days: 30
