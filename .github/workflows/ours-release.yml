name: Ours Release

# fork 私有工作流：只在 vX.Y.Z-ours* tag 上跑，产出 linux/arm64 + linux/amd64 发布包。
# 不建 GitHub Release、不推任何镜像、不碰上游。
on:
  push:
    tags:
      - 'v*-ours'
      - 'v*-ours.*'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    # 双保险：即使这个文件被同步到上游仓库也不会在那边跑。
    if: github.repository == 'Cd1s/sub2api'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@v6
        with:
          version: 9

      - uses: actions/setup-node@v6
        with:
          node-version: '20'
          cache: 'pnpm'
          cache-dependency-path: frontend/pnpm-lock.yaml

      - uses: actions/setup-go@v6
        with:
          go-version-file: backend/go.mod
          check-latest: false
          cache-dependency-path: backend/go.sum

      - name: Backend tests
        working-directory: backend
        run: go test ./...

      - name: Patch unit tests (挂钩点护栏)
        working-directory: backend
        run: |
          go test ./internal/service/ -count=1 -v \
            -run 'Ours|Tiering|CandidateBetter|LoadPlan|ScoreSnapshot|SchedulingPriorityFor|RateLimitServiceSchedulerScore'

      - name: Frontend toggle spec
        run: |
          pnpm --dir frontend install --frozen-lockfile
          (cd frontend && npx vitest run src/components/account/__tests__/EditAccountModal.oursTiering.spec.ts)

      - name: Build release archives (linux/arm64 + linux/amd64)
        run: ours/build-release.sh dist

      - uses: actions/upload-artifact@v7
        with:
          name: sub2api-ours-linux
          path: |
            dist/sub2api_*_linux_*.tar.gz
            dist/checksums.txt
          retention-days: 30
